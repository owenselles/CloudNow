name: Beta Release

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number
        required: true
        type: number
      branch:
        description: Optional PR branch name; must match the pull request
        required: false
        type: string

run-name: "PR #${{ inputs.pr_number }} beta release"

concurrency:
  group: beta-release-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      branch: ${{ steps.source.outputs.branch }}
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      source_label: ${{ steps.source.outputs.source_label }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Resolve beta source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Select main in the Run workflow branch menu."
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Enter a positive pull request number."
            exit 1
          fi

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .head.repo.full_name == $repo' \
            <<< "$pr" > /dev/null; then
            echo "::error::PR must be open and come from this repository."
            exit 1
          fi

          commit_sha="$(jq -r '.head.sha' <<< "$pr")"
          branch="$(jq -r '.head.ref' <<< "$pr")"
          if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::PR head does not point to a commit."
            exit 1
          fi

          requested_branch="${REQUESTED_BRANCH#refs/heads/}"
          if [[ -n "$requested_branch" && "$requested_branch" != "$branch" ]]; then
            echo "::error::PR #$PR_NUMBER uses branch '$branch', not '$requested_branch'."
            exit 1
          fi

          workflow_changes="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | select(.filename | startswith(".github/workflows/")) | .filename')"
          if [[ -n "$workflow_changes" ]]; then
            echo "::error::Beta releases do not support PRs that change workflow files."
            exit 1
          fi

          tag="v$(date +%Y.%m.%d)-${commit_sha:0:7}-beta.$PR_NUMBER"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"
          printf 'source_label=PR #%s (%s)\n' "$PR_NUMBER" "$branch" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CLOUDNOW_DISABLE_LIVE_SERVICES: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TZ: UTC
    steps:
      - name: Checkout beta source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$COMMIT_SHA" ]]; then
            echo "::error::Checked-out commit does not match the resolved beta source."
            exit 1
          fi

      - name: Run tvOS test plan
        run: Scripts/test.sh

      - name: Install SwiftFormat 0.62.1
        run: |
          mkdir -p "$RUNNER_TEMP/swiftformat" "$RUNNER_TEMP/pinned-tools"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.62.1/swiftformat.artifactbundle.zip
          unzip -qo "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          SF_BIN=$(find "$RUNNER_TEMP/swiftformat" -type f -name swiftformat -perm -111 | head -1)
          install -m 0755 "$SF_BIN" "$RUNNER_TEMP/pinned-tools/swiftformat"
          test "$("$RUNNER_TEMP/pinned-tools/swiftformat" --version)" = "0.62.1"

      - name: Install SwiftLint 0.65.0
        run: |
          mkdir -p "$RUNNER_TEMP/swiftlint" "$RUNNER_TEMP/pinned-tools"
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            https://github.com/realm/SwiftLint/releases/download/0.65.0/portable_swiftlint.zip
          unzip -qo "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          SL_BIN=$(find "$RUNNER_TEMP/swiftlint" -type f -name swiftlint -perm -111 | head -1)
          install -m 0755 "$SL_BIN" "$RUNNER_TEMP/pinned-tools/swiftlint"
          test "$("$RUNNER_TEMP/pinned-tools/swiftlint" version)" = "0.65.0"

      - name: SwiftFormat (format check)
        run: |
          "$RUNNER_TEMP/pinned-tools/swiftformat" --lint --config .swiftformat \
            CloudNow CloudNowTests CloudNowUITests

      - name: SwiftLint (strict)
        run: |
          "$RUNNER_TEMP/pinned-tools/swiftlint" --strict --config .swiftlint.yml \
            CloudNow CloudNowTests CloudNowUITests

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project CloudNow.xcodeproj \
            -scheme CloudNow \
            -clonedSourcePackagesDirPath .spm-packages

      - name: Archive
        run: |
          xcodebuild archive \
            -project CloudNow.xcodeproj \
            -scheme CloudNow \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -archivePath "$RUNNER_TEMP/CloudNow.xcarchive" \
            -clonedSourcePackagesDirPath .spm-packages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/CloudNow.xcarchive/Products/Applications/CloudNow.app" \
            "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r CloudNow.ipa Payload/

      - name: Transfer IPA to release job
        uses: actions/upload-artifact@v7
        with:
          name: cloudnow-beta-ipa
          path: ${{ runner.temp }}/CloudNow.ipa
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v7
        with:
          name: cloudnow-beta-ipa
          path: ${{ runner.temp }}/pr-beta

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          SOURCE_LABEL: ${{ needs.resolve.outputs.source_label }}
          COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" --arg commit "$COMMIT_SHA" \
            '.state == "open" and .head.repo.full_name == $repo and
             .head.ref == $branch and .head.sha == $commit' \
            <<< "$pr" > /dev/null; then
            echo "::error::PR changed while the beta IPA was building. Run workflow again."
            exit 1
          fi
          source_url="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"

          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG")"
          if jq -e --arg ref "refs/tags/$TAG" \
            'any(.[]; .ref == $ref)' <<< "$refs" > /dev/null; then
            echo "::error::Beta tag $TAG already exists; this commit was released."
            exit 1
          fi

          notes="Beta build of $SOURCE_LABEL: $source_url

          Tested commit: $COMMIT_SHA

          This IPA is unsigned. Sign and sideload it to test on Apple TV."
          release_url="$(gh release create "$TAG" "$RUNNER_TEMP/pr-beta/CloudNow.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "CloudNow $TAG" \
            --notes "$notes" \
            --prerelease \
            --latest=false)"
          echo "Beta release: $release_url" >> "$GITHUB_STEP_SUMMARY"
