name: Beta Release

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number
        required: true
        type: number
      branch:
        description: Optional PR branch name; must match the pull request
        required: false
        type: string

run-name: "PR #${{ inputs.pr_number }} beta release"

concurrency:
  group: beta-release-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      pull-requests: read
      statuses: read
    outputs:
      branch: ${{ steps.source.outputs.branch }}
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      source_label: ${{ steps.source.outputs.source_label }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Resolve beta source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Select main in the Run workflow branch menu."
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Enter a positive pull request number."
            exit 1
          fi

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .base.ref == "main" and
             .head.repo.full_name == $repo' \
            <<< "$pr" > /dev/null; then
            echo "::error::PR must be open, target main, and come from this repository."
            exit 1
          fi

          commit_sha="$(jq -r '.head.sha' <<< "$pr")"
          branch="$(jq -r '.head.ref' <<< "$pr")"
          if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::PR head does not point to a commit."
            exit 1
          fi

          requested_branch="${REQUESTED_BRANCH#refs/heads/}"
          if [[ -n "$requested_branch" && "$requested_branch" != "$branch" ]]; then
            echo "::error::PR #$PR_NUMBER uses branch '$branch', not '$requested_branch'."
            exit 1
          fi

          workflow_changes="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | select(.filename | startswith(".github/workflows/")) | .filename')"
          if [[ -n "$workflow_changes" ]]; then
            echo "::error::Beta releases do not support PRs that change workflow files."
            exit 1
          fi

          require_workflow_success() {
            local workflow="$1"
            local label="$2"
            local pages
            local latest

            pages="$(gh api --paginate --slurp --method GET \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f event=pull_request \
              -f head_sha="$commit_sha" \
              -F per_page=100)"
            latest="$(jq -c --arg commit "$commit_sha" --argjson pr "$PR_NUMBER" \
              '[.[].workflow_runs[] |
                select(.event == "pull_request" and .head_sha == $commit) |
                select(any(.pull_requests[]?;
                  .number == $pr and .head.sha == $commit))] |
               max_by([.run_number, .run_attempt])' <<< "$pages")"
            if [[ "$latest" == "null" ]]; then
              echo "::error::$label has no run for PR #$PR_NUMBER at $commit_sha."
              exit 1
            fi
            if ! jq -e \
              '.status == "completed" and .conclusion == "success"' \
              <<< "$latest" > /dev/null; then
              echo "::error::$label has not completed successfully for $commit_sha."
              exit 1
            fi
          }

          require_workflow_success "tests.yml" "The PR Tests workflow"
          require_workflow_success "lint.yml" "The PR Lint workflow"

          check_pages="$(gh api --paginate --slurp --method GET \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$commit_sha/check-runs" \
            -f filter=latest \
            -F per_page=100)"
          if [[ "$(jq '[.[].check_runs[]] | length' <<< "$check_pages")" == "0" ]]; then
            echo "::error::No check runs were found for commit $commit_sha."
            exit 1
          fi

          unsuccessful_checks="$(jq -r \
            '.[].check_runs[] |
             select(.status != "completed" or .conclusion != "success") |
             "\(.app.slug) / \(.name): \(.status) (\(.conclusion))"' \
            <<< "$check_pages")"
          if [[ -n "$unsuccessful_checks" ]]; then
            echo "::error::Every PR check run must complete successfully before a beta release."
            echo "$unsuccessful_checks"
            exit 1
          fi

          if ! jq -e \
            'any(.[].check_runs[]; .app.slug == "github-advanced-security" and
             .name == "CodeQL" and .status == "completed" and
             .conclusion == "success")' <<< "$check_pages" > /dev/null; then
            echo "::error::The PR CodeQL check has not completed successfully."
            exit 1
          fi

          status_pages="$(gh api --paginate --slurp --method GET \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$commit_sha/status" \
            -F per_page=100)"
          unsuccessful_statuses="$(jq -r \
            '.[].statuses[] | select(.state != "success") |
             "\(.context): \(.state)"' <<< "$status_pages")"
          if [[ -n "$unsuccessful_statuses" ]]; then
            echo "::error::Every PR commit status must be successful before a beta release."
            echo "$unsuccessful_statuses"
            exit 1
          fi

          current_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$branch" --arg commit "$commit_sha" \
            '.state == "open" and .base.ref == "main" and
             .head.repo.full_name == $repo and .head.ref == $branch and
             .head.sha == $commit' \
            <<< "$current_pr" > /dev/null; then
            echo "::error::PR changed while its checks were being validated. Run workflow again."
            exit 1
          fi

          tag="v$(date +%Y.%m.%d)-${commit_sha:0:7}-beta.$PR_NUMBER"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"
          printf 'source_label=PR #%s (%s)\n' "$PR_NUMBER" "$branch" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CLOUDNOW_DISABLE_LIVE_SERVICES: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TZ: UTC
    steps:
      - name: Checkout beta source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$COMMIT_SHA" ]]; then
            echo "::error::Checked-out commit does not match the resolved beta source."
            exit 1
          fi

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project CloudNow.xcodeproj \
            -scheme CloudNow \
            -clonedSourcePackagesDirPath .spm-packages

      - name: Archive
        run: |
          xcodebuild archive \
            -project CloudNow.xcodeproj \
            -scheme CloudNow \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -archivePath "$RUNNER_TEMP/CloudNow.xcarchive" \
            -clonedSourcePackagesDirPath .spm-packages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/CloudNow.xcarchive/Products/Applications/CloudNow.app" \
            "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r CloudNow.ipa Payload/

      - name: Transfer IPA to release job
        uses: actions/upload-artifact@v7
        with:
          name: cloudnow-beta-ipa
          path: ${{ runner.temp }}/CloudNow.ipa
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v7
        with:
          name: cloudnow-beta-ipa
          path: ${{ runner.temp }}/pr-beta

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          SOURCE_LABEL: ${{ needs.resolve.outputs.source_label }}
          COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" --arg commit "$COMMIT_SHA" \
            '.state == "open" and .base.ref == "main" and
             .head.repo.full_name == $repo and .head.ref == $branch and
             .head.sha == $commit' \
            <<< "$pr" > /dev/null; then
            echo "::error::PR changed while the beta IPA was building. Run workflow again."
            exit 1
          fi
          source_url="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"

          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG")"
          if jq -e --arg ref "refs/tags/$TAG" \
            'any(.[]; .ref == $ref)' <<< "$refs" > /dev/null; then
            echo "::error::Beta tag $TAG already exists; this commit was released."
            exit 1
          fi

          notes="Beta build of $SOURCE_LABEL: $source_url

          Tested commit: $COMMIT_SHA

          This IPA is unsigned. Sign and sideload it to test on Apple TV."
          release_url="$(gh release create "$TAG" "$RUNNER_TEMP/pr-beta/CloudNow.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "CloudNow $TAG" \
            --notes "$notes" \
            --prerelease \
            --latest=false)"
          echo "Beta release: $release_url" >> "$GITHUB_STEP_SUMMARY"
